<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Beer Night 🍻</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     BEER NIGHT — ARCADE EDITION, two themes.
     "dark" = the original pub-at-midnight look, turned up: chunky
     embossed buttons, amber glow shadows instead of flat borders,
     a shine-sweep energy bar, small looping juice animations.
     "bright" = the bright/colourful arcade theme, same mechanics,
     cream-and-neon palette instead of glow-on-black.
     Switch with the toggle in the header — choice is remembered.
     All variable NAMES are unchanged from the original file, so
     every template string below still points at the right thing.
  ============================================================ */
  html[data-theme="dark"]{
    --card:#241910; --edge:#4E3822;
    --amber:#F2A81D; --amber-bright:#FFCB55; --amber-deep:#6E4610;
    --teal:#2FE0C6; --pink:#FF5C82;
    --foam:#F7EFDD; --muted:#C2A47D; --danger:#FF6B4A;
    --bg-glow-1:rgba(242,168,29,.20); --bg-glow-2:rgba(255,92,130,.12);
    --bg-grad:linear-gradient(165deg,#170F09 0%,#100A06 55%,#0A0603 100%);
    --shadow-ink:0 6px 0 #0A0603, 0 0 24px rgba(242,168,29,.20);
    --input-bg:#160F09; --text-input:#F7EFDD;
    --modal-scrim:rgba(6,3,1,.72);
  }
  html[data-theme="bright"]{
    --card:#FFFFFF; --edge:#2B1B08;
    --amber:#F2790A; --amber-bright:#FFB020; --amber-deep:#B34700;
    --teal:#00B4A0; --pink:#FF5C82;
    --foam:#2B1B08; --muted:#8A6F52; --danger:#E63946;
    --bg-glow-1:#FFCFE0aa; --bg-glow-2:#B6F3E5aa;
    --bg-grad:linear-gradient(165deg,#FFF7E6 0%,#FFE3A6 55%,#FFC978 100%);
    --shadow-ink:0 6px 0 var(--edge), 0 12px 22px rgba(43,27,8,.16);
    --input-bg:#FFFDF8; --text-input:#2B1B08;
    --modal-scrim:rgba(43,27,8,.6);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{background:var(--bg-grad);}
  body{
    margin:0; min-height:100vh; color:var(--foam);
    background:
      radial-gradient(700px 420px at 8% -6%, var(--bg-glow-1), transparent 62%),
      radial-gradient(760px 460px at 96% 4%, var(--bg-glow-2), transparent 60%),
      var(--bg-grad);
    background-attachment:fixed;
    font-family:'Baloo 2',system-ui,-apple-system,sans-serif; padding-bottom:70px;
    transition:background-color .25s ease, color .25s ease;
  }
  .wrap{max-width:560px;margin:0 auto;padding:10px 16px;}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 6px;max-width:560px;margin:0 auto;gap:10px;}
  .logo{font-family:'Lilita One',system-ui;font-size:26px;color:var(--amber);margin:0;letter-spacing:.5px;display:flex;align-items:center;gap:10px;min-width:0;}
  .logo .icon{width:30px;height:30px;flex-shrink:0;}
  .tagline{display:block;font-family:'Baloo 2',system-ui;font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--pink);margin-top:-2px;}
  .hdr-controls{display:flex;gap:6px;align-items:center;flex-shrink:0;}
  .toggle-btn{background:var(--card);border:2px solid var(--edge);border-radius:12px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--edge);color:var(--foam);transition:transform .08s ease, box-shadow .08s ease;}
  .toggle-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge);}
  .toggle-btn .icon{width:18px;height:18px;}
  h2.section{font-family:'Lilita One',system-ui;font-size:16px;margin:22px 4px 10px;letter-spacing:.4px;color:var(--foam);}
  .card{background:var(--card);border:3px solid var(--edge);border-radius:20px;padding:16px;box-shadow:var(--shadow-ink);}
  .row{display:flex;gap:8px;}
  input{
    flex:1;background:var(--input-bg);border:3px solid var(--edge);border-radius:14px;
    padding:12px 14px;color:var(--text-input);font-size:16px;min-width:0;font-family:'Baloo 2',system-ui;font-weight:600;
  }
  input::placeholder{color:var(--muted);opacity:.8;}
  button{cursor:pointer;font-size:16px;font-family:'Baloo 2',system-ui;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
  .icon{width:1em;height:1em;display:inline-block;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .icon.filled{fill:currentColor;stroke:none;}
  .btn{
    background:linear-gradient(180deg,var(--amber-bright),var(--amber));color:#2B1400;border:3px solid var(--edge);border-radius:14px;
    padding:12px 18px;font-family:'Lilita One',system-ui;letter-spacing:.4px;
    box-shadow:0 5px 0 var(--amber-deep); transition:transform .08s ease, box-shadow .08s ease;
    display:inline-flex; align-items:center; gap:6px; justify-content:center;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--amber-deep);}
  .ghost{background:var(--card);color:var(--foam);border:3px solid var(--edge);border-radius:14px;padding:9px 16px;font-size:14px;font-weight:700;box-shadow:0 4px 0 var(--edge);transition:transform .08s ease, box-shadow .08s ease;display:inline-flex;align-items:center;gap:6px;}
  .ghost:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge);}
  .ghost.danger{color:#fff;background:var(--danger);border-color:#7a2013;box-shadow:0 4px 0 #7a2013;}
  .back{
    background:var(--card);color:var(--foam);border:3px solid var(--edge);border-radius:14px;
    font-family:'Lilita One',system-ui;font-size:14px;letter-spacing:.3px;
    padding:8px 14px 8px 10px;margin:2px 0 10px;box-shadow:0 4px 0 var(--edge);
    display:inline-flex;align-items:center;gap:4px;transition:transform .08s ease, box-shadow .08s ease;
  }
  .back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge);}
  .back .icon{width:16px;height:16px;}
  .night-row{
    display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;
    background:var(--card);border:3px solid var(--edge);border-radius:18px;
    padding:14px 16px;margin-bottom:10px;text-align:left;color:var(--foam);
    box-shadow:var(--shadow-ink); transition:transform .08s ease, box-shadow .08s ease;
  }
  .night-row:active{transform:translateY(4px);box-shadow:0 2px 0 var(--edge);}
  .night-name{font-family:'Lilita One',system-ui;font-size:18px;}
  .night-meta{color:var(--muted);font-size:13px;margin-top:2px;font-weight:600;}
  .live{background:var(--pink);color:#fff;font-size:10px;font-weight:800;letter-spacing:1px;border-radius:999px;padding:3px 9px;margin-left:8px;vertical-align:middle;font-family:'Baloo 2',system-ui;display:inline-block;animation:livePulse 1.7s ease-in-out infinite;}
  .person{
    position:relative;overflow:hidden;background:var(--card);
    border:3px solid var(--edge);border-radius:18px;padding:14px 12px;margin-bottom:10px;
    box-shadow:var(--shadow-ink);
  }
  .fill{
    position:absolute;left:0;top:0;bottom:0;border-radius:15px 0 0 15px;overflow:hidden;
    background:linear-gradient(90deg,var(--teal) 0%,var(--amber-bright) 100%);
    border-right:4px solid var(--edge);transition:width .35s ease;opacity:.5;
  }
  .fill::after{
    content:"";position:absolute;top:0;bottom:0;left:0;width:34%;
    background:linear-gradient(90deg,transparent,#ffffffb0,transparent);
    animation:shine 2.8s ease-in-out infinite;
  }
  @media (prefers-reduced-motion:reduce){
    .fill{transition:none;} .fill::after{animation:none;}
    .live, .crown, .plus:not(.cooling){animation:none !important;}
  }
  .person-inner{position:relative;display:flex;align-items:center;gap:8px;}
  .avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--edge);flex-shrink:0;}
  .avatar-ph{width:32px;height:32px;border-radius:50%;border:2px solid var(--edge);background:var(--amber-deep);color:var(--amber-bright);display:flex;align-items:center;justify-content:center;font-family:'Lilita One',system-ui;font-size:15px;flex-shrink:0;}
  .rank{width:24px;text-align:center;color:var(--muted);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
  .crown{display:inline-flex;width:20px;height:20px;color:var(--amber);animation:crownBounce 1.6s ease-in-out infinite;filter:drop-shadow(0 2px 1px rgba(0,0,0,.3));}
  .pname{flex:1;font-family:'Lilita One',system-ui;font-size:17px;letter-spacing:.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pcount{color:var(--amber);font-family:'Lilita One',system-ui;font-size:22px;min-width:26px;text-align:right;}
  .plus{background:linear-gradient(180deg,var(--amber-bright),var(--amber));color:#2B1400;border:3px solid var(--edge);border-radius:14px;min-width:64px;height:46px;font-family:'Lilita One',system-ui;font-size:15px;padding:0 8px;box-shadow:0 5px 0 var(--amber-deep);transition:transform .08s ease, box-shadow .08s ease;display:inline-flex;align-items:center;justify-content:center;gap:5px;}
  .plus .icon{width:16px;height:16px;}
  .plus:active{transform:translateY(4px);box-shadow:0 1px 0 var(--amber-deep);}
  .plus:not(.cooling){animation:readyPulse 1.9s ease-in-out infinite;}
  .plus.cooling{background:var(--edge);color:var(--muted);font-family:'Baloo 2',system-ui;font-weight:700;font-size:13px;box-shadow:0 5px 0 rgba(0,0,0,.35);}
  .cam{background:var(--card);border:3px solid var(--edge);border-radius:14px;width:44px;height:46px;font-size:17px;color:var(--foam);box-shadow:0 4px 0 var(--edge);transition:transform .08s ease, box-shadow .08s ease;display:inline-flex;align-items:center;justify-content:center;}
  .cam .icon{width:18px;height:18px;}
  .cam:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge);}
  .x{background:none;border:none;color:var(--muted);font-size:18px;width:24px;height:46px;}
  .hint{color:var(--muted);font-size:12px;margin-top:18px;line-height:1.6;font-weight:600;}
  .status{color:var(--amber);font-size:12px;font-weight:700;}
  .error{max-width:560px;margin:0 auto 8px;padding:10px 16px;color:#fff;background:var(--danger);border:2px solid var(--edge);border-radius:14px;font-size:14px;font-weight:700;}
  .muted-center{color:var(--muted);text-align:center;font-weight:600;}
  .room-pill{background:var(--card);border:3px solid var(--edge);color:var(--foam);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;box-shadow:0 3px 0 var(--edge);}
  .setup{line-height:1.65;font-size:15px;}
  .setup code{background:var(--edge);border:1px solid var(--edge);border-radius:6px;padding:2px 6px;font-size:13px;color:var(--amber-bright);font-weight:700;}
  .setup ol{padding-left:20px;margin:10px 0;}
  .setup li{margin-bottom:8px;}
  a{color:var(--amber);font-weight:700;}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
  .shot{border:3px solid var(--edge);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 4px 0 var(--edge);}
  .shot img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;}
  .shot .ts{font-size:10px;color:var(--muted);padding:4px 6px;text-align:center;font-weight:700;}
  .modal{
    position:fixed;inset:0;background:var(--modal-scrim);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal img{max-width:100%;max-height:80vh;border-radius:18px;border:4px solid var(--card);box-shadow:0 12px 30px rgba(0,0,0,.45);}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:linear-gradient(180deg,var(--amber-bright),var(--amber));color:#2B1400;font-family:'Lilita One',system-ui;
    padding:12px 22px;border-radius:999px;font-size:16px;z-index:60;
    border:3px solid var(--edge);box-shadow:0 6px 0 var(--amber-deep);
    animation:toastIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  .tabbar{display:flex;gap:6px;background:var(--card);border:3px solid var(--edge);border-radius:14px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow-ink);}
  .tab{flex:1;background:none;border:none;border-radius:10px;padding:9px 6px;font-family:'Lilita One',system-ui;font-size:13px;letter-spacing:.3px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px;transition:background-color .15s ease, color .15s ease;}
  .tab.active{background:linear-gradient(180deg,var(--amber-bright),var(--amber));color:#2B1400;}
  .tab .icon{width:14px;height:14px;}
  .lb-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:2px dashed var(--edge);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{font-family:'Lilita One',system-ui;font-size:15px;width:24px;text-align:center;color:var(--muted);}
  .lb-rank.top1{color:var(--amber);font-size:18px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat-tile{background:var(--card);border:3px solid var(--edge);border-radius:16px;padding:12px;box-shadow:var(--shadow-ink);text-align:center;}
  .stat-tile .icon{width:22px;height:22px;color:var(--amber);margin-bottom:4px;}
  .stat-tile .stat-label{font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--muted);}
  .stat-tile .stat-value{font-family:'Lilita One',system-ui;font-size:15px;margin-top:2px;line-height:1.25;}
  .stat-tile .stat-sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px;}
  @keyframes crownBounce{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-4px) rotate(6deg);}}
  @keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(255,92,130,.55);}50%{box-shadow:0 0 0 6px rgba(255,92,130,0);}}
  @keyframes readyPulse{0%,100%{box-shadow:0 5px 0 var(--amber-deep);}50%{box-shadow:0 5px 0 var(--amber-deep), 0 0 0 6px rgba(242,121,10,.3);}}
  @keyframes shine{0%{transform:translateX(-140%);}100%{transform:translateX(340%);}}
  @keyframes floatIn{0%{opacity:0;transform:translateY(10px);}100%{opacity:1;transform:translateY(0);}}
  .card,.night-row,.person{animation:floatIn .3s ease both;}
  @media (prefers-reduced-motion:reduce){ .card,.night-row,.person,.toast{animation:none;} }
</style>
</head>

<!-- ============================================================
  BEER NIGHT v2 — photo-proof edition 📸🍺
  Every point requires a photo with your drink, and each player
  must wait 3 minutes between drinks (anti-cheat cooldown).

  ONE-TIME SETUP (~5 minutes, free forever on the Spark plan):
  1. Go to https://console.firebase.google.com and create a project
     (call it anything, e.g. "beer-night"; Analytics off is fine).
  2. In the project: Build > Realtime Database > Create database
     > choose a location > start in TEST MODE.
  3. IMPORTANT — test mode expires after 30 days. To make it
     permanent, go to Realtime Database > Rules and replace with:

       {
         "rules": {

<!-- ============================================================
  THEME TOGGLE — "dark" (default, the original look turned up) and
  "bright" (the arcade/colourful theme). Choice is remembered.
  SOUND FX — small synthesized blips via the Web Audio API instead
  of an external track (nothing to license or fetch). Every sound
  fires from a real tap, and there's a mute toggle that's respected
  everywhere, including the generic button-click sound below.
============================================================ -->
<script>
  (function(){
    const root = document.documentElement;
    const THEME_KEY = "beernight-theme", MUTE_KEY = "beernight-muted";

    function applyThemeIcon(theme){
      const use = document.getElementById("themeIconUse");
      if (use) use.setAttribute("href", theme === "dark" ? "#icon-sun" : "#icon-moon");
      const btn = document.getElementById("themeToggle");
      if (btn) btn.title = theme === "dark" ? "Switch to bright arcade theme" : "Switch to dark theme";
    }
    function applySoundIcon(muted){
      const use = document.getElementById("soundIconUse");
      if (use) use.setAttribute("href", muted ? "#icon-speaker-off" : "#icon-speaker");
    }
    const savedTheme = localStorage.getItem(THEME_KEY) || "dark";
    root.setAttribute("data-theme", savedTheme);

    window.addEventListener("DOMContentLoaded", () => {
      applyThemeIcon(savedTheme);
      applySoundIcon(localStorage.getItem(MUTE_KEY) === "1");
      const themeBtn = document.getElementById("themeToggle");
      if (themeBtn) themeBtn.onclick = () => {
        const next = root.getAttribute("data-theme") === "dark" ? "bright" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem(THEME_KEY, next);
        applyThemeIcon(next);
        window.AudioFX && window.AudioFX.click();
      };
      const soundBtn = document.getElementById("soundToggle");
      if (soundBtn) soundBtn.onclick = () => {
        const muted = window.AudioFX.toggleMute();
        applySoundIcon(muted);
        if (!muted) window.AudioFX.click();
      };
      // one soft click on every button tap in the app, without touching
      // any individual onclick handler
      document.addEventListener("click", (e) => {
        const el = e.target.closest("button");
        if (el && !el.disabled) window.AudioFX.click();
      }, true);
    });

    // ---- synthesized sound effects ----
    let actx = null;
    function ctx(){ if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
    function isMuted(){ return localStorage.getItem(MUTE_KEY) === "1"; }
    function tone(freq, dur, type, vol, delay){
      if (isMuted()) return;
      try{
        const c = ctx();
        if (c.state === "suspended") c.resume();
        const o = c.createOscillator(), g = c.createGain();
        o.type = type || "sine"; o.frequency.value = freq;
        const t0 = c.currentTime + (delay||0);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol||0.16, t0+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
        o.connect(g); g.connect(c.destination);
        o.start(t0); o.stop(t0+dur+0.03);
      }catch(e){}
    }
    window.AudioFX = {
      pop(){ tone(520,0.09,"triangle",0.22); tone(780,0.12,"triangle",0.15,0.05); },
      fanfare(){ [523,659,784,1046].forEach((f,i)=> tone(f,0.2,"square",0.15,i*0.09)); },
      click(){ tone(340,0.045,"square",0.09); },
      chime(){ tone(660,0.12,"sine",0.15); tone(880,0.14,"sine",0.11,0.06); },
      buzz(){ tone(140,0.22,"sawtooth",0.17); },
      toggleMute(){ const m = !isMuted(); localStorage.setItem(MUTE_KEY, m?"1":"0"); return m; },
      isMuted
    };
  })();
</script>

const nameCore = (s) => String(s||"").toLowerCase().replace(/[^a-z0-9]/g, "");

// Catches joke/junk entries like "Bob-bOb-bob-bOB" or "Bob Bob Bob" — a
// short word repeated with separators and mixed case instead of a real
// name — and asks for a real one instead of quietly accepting it.
function validateName(raw){
  const clean = raw.trim().replace(/\s+/g, " ");
  if (!clean) return { ok:false, message:"Type a name first." };
  const segments = clean.split(/[\s\-_.]+/).filter(Boolean);
  if (segments.length >= 2 && segments.every(seg => seg.toLowerCase() === segments[0].toLowerCase())) {
    const suggestion = segments[0][0].toUpperCase() + segments[0].slice(1).toLowerCase();
    return { ok:false, message:`"${clean}" is just "${suggestion}" repeated — try "${suggestion}".` };
  }

}

// ---------- photo helpers ----------
function compressImage(file, maxDim = 400, quality = 0.55){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let {width:w, height:h} = img;
      const scale = Math.min(1, maxDim / Math.max(w,h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(cv.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    img.src = url;
  });
}

// ---------- in-page camera (fixes "kicked out" on phones) ----------
// Handing a photo off to <input capture> opens the phone's native camera
// APP, which backgrounds this tab — and on tight-memory phones (mostly
// iPhones) the browser sometimes just kills and reloads the tab while
// it's backgrounded. Coming back then looks like getting bounced out of
// the night. Taking the photo with an in-page <video> preview instead
// keeps this tab active the whole time, so there's nothing to discard.
// If the browser/device can't do that (old browser, no camera, insecure
// context, permission denied), it falls straight back to the original
// native-camera-app flow so nothing is ever left broken.
let activeStream = null;
function stopActiveStream(){
  if (activeStream) { activeStream.getTracks().forEach(t=>t.stop()); activeStream = null; }
}
function canUseInPageCamera(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.isSecureContext);
}
function openCameraModal(onDone){
  const m = document.createElement("div");
  m.className = "modal"; m.style.flexDirection = "column";
  m.innerHTML = `
    <div class="card" style="padding:10px;max-width:420px;width:100%;">
      <video id="camPreview" autoplay playsinline muted style="width:100%;border-radius:12px;background:#000;display:block;transform:scaleX(-1);"></video>
      <div style="display:flex;gap:10px;margin-top:12px;">
        <button class="ghost" id="camCancel" style="flex:1;">Cancel</button>
        <button class="btn" id="camShoot" style="flex:2;"><svg class="icon"><use href="#icon-camera"></use></svg> Take photo</button>
      </div>
    </div>`;
  document.body.appendChild(m);
  const video = m.querySelector("#camPreview");
  const finish = (file)=>{ stopActiveStream(); m.remove(); onDone(file); };
  m.querySelector("#camCancel").onclick = ()=> finish(null);
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
    .then(stream=>{
      activeStream = stream;
      video.srcObject = stream;
    })
    .catch(()=> finish(undefined));   // undefined = "couldn't open in-page camera", caller should fall back
  m.querySelector("#camShoot").onclick = ()=>{
    if (!video.videoWidth) return;    // stream not ready yet
    const cv = document.createElement("canvas");
    cv.width = video.videoWidth; cv.height = video.videoHeight;
    const cx = cv.getContext("2d");
    cx.translate(cv.width, 0); cx.scale(-1, 1);   // un-mirror the selfie preview
    cx.drawImage(video, 0, 0);
    cv.toBlob(blob=>{
      finish(blob ? new File([blob], "photo.jpg", { type:"image/jpeg" }) : undefined);
    }, "image/jpeg", 0.9);
  };
}
// Delivers a captured File into a real <input type=file> and fires its
// existing 'change' handler, so every downstream upload/compress/save
// code path stays exactly as-is regardless of which camera path was used.
function deliverToInput(input, file){
  try{
    const dt = new DataTransfer();
    dt.items.add(file);
    input.files = dt.files;
    input.dispatchEvent(new Event("change", { bubbles:true }));
  }catch(e){
    showError("Couldn't attach that photo — try again.");
  }
}
function captureViaCamera(input){
  if (!canUseInPageCamera()) { input.click(); return; }   // old browser / http — original flow
  openCameraModal(file=>{
    if (file === undefined) { input.click(); return; }     // in-page camera failed — fall back
    if (!file) return;                                      // user cancelled — do nothing
    deliverToInput(input, file);
  });
}

// ----- avatar upload (separate input so people can pick from their gallery too) -----
const avInput = document.getElementById("avInput");

      delete photoCache[p.avatar];
    }

  }catch(e){

    statusEl.textContent = "room " + roomCode;
  }
});

// fetch any avatars we haven't cached yet, then refresh once they're in
const avatarFetching = new Set();
function ensureAvatars(people){
  const missing = people.filter(p => p.avatar && !photoCache[p.avatar] && !avatarFetching.has(p.avatar));
  if (!missing.length) return;
  missing.forEach(p => avatarFetching.add(p.avatar));
  Promise.all(missing.map(async (p)=>{
    try{
      const snap = await get(ref(db, `rooms/${roomCode}/photos/${p.avatar}`));
      if (snap.exists()) photoCache[p.avatar] = snap.val();
    }catch(e){}
    finally{ avatarFetching.delete(p.avatar); }
  })).then(()=> render());
}
const avatarHtml = (p) => p.avatar && photoCache[p.avatar]
  ? `<img class="avatar" src="${photoCache[p.avatar]}" alt="">`
  : `<span class="avatar-ph">${esc((p.name||"?").charAt(0).toUpperCase())}</span>`;


function downloadDataUrl(dataUrl, name){
  const a = document.createElement("a");
  a.href = dataUrl; a.download = name; a.click();
}
async function shareDataUrl(dataUrl, name){
  try{
    const blob = await (await fetch(dataUrl)).blob();
    const file = new File([blob], name, { type: "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Beer Night 🍺" });
    } else {
      downloadDataUrl(dataUrl, name);
    }
  }catch(e){ /* user cancelled share — fine */ }
}

camInput.addEventListener("change", async ()=>{

  camInput.value = "";
  if (!file || !pendingPhoto) { pendingPhoto = null; return; }
  // first-run camera check — no point awarded, just confirms the camera flow works

      if (!cp.checkpoints) cp.checkpoints = {};
      cp.checkpoints[id] = { ts: Date.now(), milestone };
      photoCache[id] = b64;
      await saveData();
      toast(`🚨 ${milestone}-beer checkpoint logged!`);
      window.AudioFX && window.AudioFX.fanfare();
    }catch(e){
      showError("Photo upload failed — try again.");
      statusEl.textContent = "room " + roomCode;
    }
    return;
  }
  const { pid } = pendingPhoto;
  pendingPhoto = null;
  const n = data.nights[view.nightId];
  const p = n?.people?.[pid];
  if (!n || !p || n.ended || p.out) return;

  // re-check cooldown at submission time (photo can't be pre-taken to skip it)
  const last = latestDrinkTs(p);
  if (last && Date.now() - last < COOLDOWN_MS) {
    toast("⏳ Too soon — pace yourself!");
    return;
  }

  try{
    statusEl.textContent = "uploading photo…";
    const b64 = await compressImage(file);
    const drinkId = uid();
    // photo stored separately so live sync stays lightweight
    await set(ref(db, `rooms/${roomCode}/photos/${drinkId}`), b64);
    if (!p.drinks) p.drinks = {};
    p.drinks[drinkId] = { ts: Date.now() };
    photoCache[drinkId] = b64;
    await saveData();
    toast(`🍺 +1 for ${p.name}!`);
    window.AudioFX && window.AudioFX.pop();
    // checkpoint time? fires at 10, 20, 30… and re-asks next beer if skipped
    const milestone = Math.floor(countOf(p) / 10) * 10;
    if (milestone > 0 && !hasCheckpoint(p, milestone)) {
      setTimeout(()=> showCheckpointPrompt(pid, milestone), 600);
    }
  }catch(e){
    showError("Photo upload failed — try again.");
    statusEl.textContent = "room " + roomCode;
  }
});

// ---------- back-button protection ----------
// The browser back button navigates WITHIN the app (photo → gallery → night → home).
// Only when already on the home screen does it ask before actually leaving.
history.pushState({ bn: 1 }, "");
window.addEventListener("popstate", ()=>{
  // if a photo/slideshow/menu overlay is open, back just closes it
  const modal = document.querySelector(".modal");
  if (modal) {
    modal.click();                       // triggers each modal's own close/cleanup
    if (document.body.contains(modal)) modal.remove();
    history.pushState({ bn: 1 }, "");
    return;
  }
  if (roomCode && view.page === "night" && view.galleryPid) {
    view = { ...view, galleryPid: null };
    render();
    history.pushState({ bn: 1 }, "");
  } else if (roomCode && (view.page === "invite" || view.page === "recap")) {
    view = { page: (view.nightId && data.nights?.[view.nightId]) ? "night" : "home", nightId: view.nightId, galleryPid: null };
    render();
    history.pushState({ bn: 1 }, "");
  } else if (roomCode && view.page === "night") {
    view = { page: "home", nightId: null, galleryPid: null };
    render();
    history.pushState({ bn: 1 }, "");
  } else {
    // at home (or no room): confirm before really leaving
    if (confirm("Leave Beer Night? 🍺\n\nAll scores are saved — you can come straight back anytime.")) {
      history.go(-1);
    } else {
      history.pushState({ bn: 1 }, "");
    }
  }
});
// safety net: warn on tab close / refresh while a live night is open
window.addEventListener("beforeunload", (e)=>{
  const n = view.nightId ? data.nights?.[view.nightId] : null;
  if (roomCode && view.page === "night" && n && !n.ended) {
    e.preventDefault();
    e.returnValue = "";
  }
});

const drinksOf = (p) => Object.entries(p.drinks || {}).sort((a,b)=>a[1].ts-b[1].ts);
const countOf = (p) => Object.keys(p.drinks || {}).length;
const latestDrinkTs = (p) => {
  const d = drinksOf(p);
  return d.length ? d[d.length-1][1].ts : null;
};
const cooldownLeft = (p) => {
  const last = latestDrinkTs(p);
  if (!last) return 0;
  return Math.max(0, COOLDOWN_MS - (Date.now() - last));
};
const fmtLeft = (ms) => {
  const s = Math.ceil(ms/1000);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
};

// ---------- lifetime stats: the "Hall of Fame" on the home screen ----------
// Walks every night in the room and rolls each roster id's drinks up into
// an all-time total, plus a few fun/useless side stats. Runs client-side
// off data already synced — no extra Firebase reads.
function computeStats(){
  const nights = Object.values(data.nights || {});
  const totals = {};        // id -> {id,name,avatar,totalDrinks,nightsPlayed}
  const nightTotals = [];   // {id,name,date,total,peopleCount}
  const paceByPerson = {};  // id -> {id,name,gaps:[ms,...]}
  let earliest = null, latest = null;   // {ts,name,nightName}
  let totalDrinksAll = 0, totalPhotos = 0;

  nights.forEach(n=>{
    const people = Object.values(n.people || {});
    let nightTotal = 0;
    people.forEach(p=>{
      const c = countOf(p);
      nightTotal += c;
      totalDrinksAll += c;
      totalPhotos += c + Object.keys(p.checkpoints||{}).length;
      if (!totals[p.id]) totals[p.id] = { id:p.id, name:p.name, avatar:p.avatar, totalDrinks:0, nightsPlayed:0 };
      totals[p.id].totalDrinks += c;
      totals[p.id].name = p.name;                    // most recently seen spelling
      if (p.avatar) totals[p.id].avatar = p.avatar;
      if (c > 0) totals[p.id].nightsPlayed += 1;

      const ds = drinksOf(p);
      if (ds.length >= 2) {
        const gaps = [];
        for (let i=1;i<ds.length;i++) gaps.push(ds[i][1].ts - ds[i-1][1].ts);
        const avg = gaps.reduce((a,b)=>a+b,0) / gaps.length;
        if (!paceByPerson[p.id]) paceByPerson[p.id] = { id:p.id, name:p.name, gaps:[] };
        paceByPerson[p.id].gaps.push(avg);
      }
      ds.forEach(([,d])=>{
        if (!earliest || timeOfDayMinutes(d.ts) < timeOfDayMinutes(earliest.ts)) earliest = { ts:d.ts, name:p.name, nightName:n.name };
        if (!latest || timeOfDayMinutes(d.ts) > timeOfDayMinutes(latest.ts)) latest = { ts:d.ts, name:p.name, nightName:n.name };
      });
    });
    if (nightTotal > 0) nightTotals.push({ id:n.id, name:n.name, date:n.date, total:nightTotal, peopleCount:people.filter(p=>countOf(p)>0).length });
  });

  const top10 = Object.values(totals).sort((a,b)=> b.totalDrinks-a.totalDrinks || a.name.localeCompare(b.name)).slice(0,10);
  const biggestNight = [...nightTotals].sort((a,b)=>b.total-a.total)[0] || null;
  const paceList = Object.values(paceByPerson).map(p=> ({ id:p.id, name:p.name, avgGapMs: p.gaps.reduce((a,b)=>a+b,0)/p.gaps.length }));
  const slowest = [...paceList].sort((a,b)=> b.avgGapMs-a.avgGapMs)[0] || null;    // longest gap between drinks
  const fastest = [...paceList].sort((a,b)=> a.avgGapMs-b.avgGapMs)[0] || null;    // shortest gap between drinks

  return { top10, biggestNight, slowest, fastest, earliest, latest, totalDrinksAll, totalPhotos, nightsCount: nights.length, peopleCount: Object.keys(totals).length };
}

window.actions = {
  createNight(){

  goHome(){ view={page:"home",nightId:null,galleryPid:null}; localStorage.removeItem("beernight-lastnight-"+roomCode); render(); },
  addPerson(){
    const n = data.nights[view.nightId]; if(!n) return;
    const raw = $("#personName").value; if(!raw.trim()) return;
    if(!n.people) n.people = {};

    const v = validateName(raw);
    if (!v.ok) { toast(v.message); return; }

    const match = findRosterByName(v.name);
    if (match) {
      // Someone with this name already exists in the room — don't silently
      // fold a typed name into them (two real people can share a first
      // name). Send the person to the one-tap chip instead, or ask for a
      // different name.
      if (n.people[match.id]) {
        toast(`👋 ${match.name} is already in this night`);
      } else {
        toast(`"${match.name}" is already a name in this room — tap their chip below to add them, or use a different name.`);
      }
      return;
    }
    const id = uid();
    n.people[id] = { id, name: v.name, drinks:{} };
    upsertRoster(id, v.name);
    $("#personName").value = "";
    saveData(); render();
  },
  addFromRoster(rid){
    const n = data.nights[view.nightId]; if(!n || n.ended) return;

    if(!n.people) n.people = {};

    const name = prompt("New name:", p.name);
    if (name === null) return;                    // cancelled

    const dupe = findRosterByName(v.name);
    if (dupe && dupe.id !== pid) { toast(`"${dupe.name}" is already a name in this room — pick a different one.`); return; }
    p.name = v.name;

    const n = data.nights[view.nightId]; if(!n) return;
    const name = prompt("New name for this night:", n.name);
    if (name === null) return;
    const clean = name.trim().slice(0, 40);
    if (!clean || clean === n.name) return;
    n.name = clean;
    saveData(); render();
    toast(`✏️ Night renamed`);
  },

    const n = data.nights[view.nightId]; if(!n || n.ended) return;
    const p = n.people?.[pid]; if(!p) return;
    p.out = !p.out;
    saveData(); render();
    toast(p.out ? `🏳️ ${p.name} taps out — score locked at ${countOf(p)}` : `🍺 ${p.name} is back in!`);
  },
  requestDrink(pid){
    const n = data.nights[view.nightId]; if(!n || n.ended) return;
    const p = n.people?.[pid]; if(!p) return;
    if (p.out) { toast(`🏳️ ${p.name} has tapped out`); return; }
    if (cooldownLeft(p) > 0) { toast("⏳ Too soon — pace yourself!"); return; }
    pendingPhoto = { pid };
    captureViaCamera(camInput); // in-page camera, falls back to native if needed
  },
  async undoDrink(pid){
    const n = data.nights[view.nightId]; if(!n) return;
    const p = n.people?.[pid]; if(!p) return;
    const d = drinksOf(p);
    if (!d.length) return;
    if (!confirm(`Remove ${p.name}'s latest drink (and its photo)?`)) return;
    const [drinkId] = d[d.length-1];
    delete p.drinks[drinkId];
    try{ await remove(ref(db, `rooms/${roomCode}/photos/${drinkId}`)); }catch(e){}
    delete photoCache[drinkId];
    saveData(); render();
  },
  removePerson(pid){
    const n = data.nights[view.nightId]; if(!n) return;
    const p = n.people?.[pid];
    if (p && countOf(p) > 0 && !confirm(`Remove ${p.name} and their ${countOf(p)} drink photos?`)) return;
    if (p?.drinks) for (const id of Object.keys(p.drinks)) {
      remove(ref(db, `rooms/${roomCode}/photos/${id}`)).catch(()=>{});
      delete photoCache[id];
    }
    if (p?.checkpoints) for (const id of Object.keys(p.checkpoints)) {
      remove(ref(db, `rooms/${roomCode}/photos/${id}`)).catch(()=>{});
      delete photoCache[id];
    }
    if (p?.avatar) {
      remove(ref(db, `rooms/${roomCode}/photos/${p.avatar}`)).catch(()=>{});
      delete photoCache[p.avatar];
    }
    delete n.people[pid];
    saveData(); render();
  },
  toggleEnded(){
    const n = data.nights[view.nightId]; if(!n) return;
    if (!n.ended && !confirm("Are you sure you're done? This ends the night for EVERYONE in the room and locks the leaderboard.\n\nIf it's just you bailing, simply stop counting — the others can keep playing without you.")) return;
    n.ended = !n.ended;
    saveData(); render();
  },
  deleteNight(){
    const n = data.nights[view.nightId]; if(!n) return;
    if (!confirm("Delete this night (and all its photos) for everyone in the room?")) return;
    for (const p of Object.values(n.people || {})) {
      for (const id of [...Object.keys(p.drinks || {}), ...Object.keys(p.checkpoints || {})]) {
        remove(ref(db, `rooms/${roomCode}/photos/${id}`)).catch(()=>{});
        delete photoCache[id];
      }
      if (p.avatar) {
        remove(ref(db, `rooms/${roomCode}/photos/${p.avatar}`)).catch(()=>{});
        delete photoCache[p.avatar];
      }
    }
    delete data.nights[view.nightId];
    localStorage.removeItem("beernight-lastnight-"+roomCode);
    view = {page:"home",nightId:null,galleryPid:null};
    saveData(); render();
  },

    m.querySelector("#phSh").onclick = async (e)=>{ e.stopPropagation(); await shareDataUrl(b64, `beer-night-photo-${id}.jpg`); };
    m.querySelector("#phX").onclick = (e)=>{ e.stopPropagation(); m.remove(); };

    view = { page:"recap", nightId:nid, galleryPid:null };

  async playSlideshow(nid, pid){ await startSlideshow(nid, pid); },

};

async function loadGalleryPhotos(pid, nid = view.nightId){
  const n = data.nights[nid]; if(!n) return;
  const p = n.people?.[pid]; if(!p) return;
  const ids = [...Object.keys(p.drinks || {}), ...Object.keys(p.checkpoints || {})]
    .filter(id => !photoCache[id]);
  await Promise.all(ids.map(async (id)=>{
    try{
      const snap = await get(ref(db, `rooms/${roomCode}/photos/${id}`));
      if (snap.exists()) photoCache[id] = snap.val();
    }catch(e){}
  }));
}

// ---------- Hall of Fame: home-screen leaderboard + fun stats ----------
function renderHallOfFame(){
  const s = computeStats();
  if (s.totalDrinksAll === 0) return "";   // nothing logged yet — don't show an empty trophy case

  const tabs = `
    <div class="tabbar">
      <button class="tab ${homeTab==='top10'?'active':''}" onclick="actions.setHomeTab('top10')"><svg class="icon"><use href="#icon-trophy"></use></svg> Top 10</button>
      <button class="tab ${homeTab==='stats'?'active':''}" onclick="actions.setHomeTab('stats')"><svg class="icon"><use href="#icon-medal"></use></svg> Fun stats</button>
    </div>`;

  if (homeTab === 'top10') {
    ensureAvatars(s.top10);
    return `
    <h2 class="section"><svg class="icon"><use href="#icon-trophy"></use></svg> Hall of Fame</h2>
    <div class="card">
      ${tabs}
      <div style="color:var(--muted);font-size:11px;font-weight:700;margin-bottom:6px;">ALL-TIME · ${s.peopleCount} ${s.peopleCount===1?'player':'players'} · ${s.nightsCount} ${s.nightsCount===1?'night':'nights'} · ${s.totalDrinksAll} drinks logged</div>
      ${s.top10.map((p,i)=>`
        <div class="lb-row">
          <span class="lb-rank ${i===0?'top1':''}">${i===0?'<svg class="icon" style="width:18px;height:18px;"><use href="#icon-crown"></use></svg>':i+1}</span>
          ${avatarHtml(p)}
          <span class="pname">${esc(p.name)}</span>
          <span class="night-meta" style="margin:0;white-space:nowrap;">${p.nightsPlayed} ${p.nightsPlayed===1?'night':'nights'}</span>
          <span class="pcount">${p.totalDrinks}</span>
        </div>`).join("")}
    </div>`;
  }

  const tiles = [];
  if (s.biggestNight) tiles.push({icon:'controller', label:'BIGGEST NIGHT', value: esc(s.biggestNight.name), sub:`${s.biggestNight.total} drinks · ${s.biggestNight.peopleCount} people`});
  if (s.slowest) tiles.push({icon:'medal', label:'SLOWEST SIPPER', value: esc(s.slowest.name), sub:`~${fmtGap(s.slowest.avgGapMs)} between beers`});
  if (s.fastest) tiles.push({icon:'siren', label:'FASTEST GULPER', value: esc(s.fastest.name), sub:`~${fmtGap(s.fastest.avgGapMs)} between beers`});
  if (s.latest) tiles.push({icon:'moon', label:'NIGHT OWL', value: esc(s.latest.name), sub:`logged one at ${timeLabel(s.latest.ts)}`});
  if (s.earliest) tiles.push({icon:'sunrise', label:'EARLY BIRD', value: esc(s.earliest.name), sub:`logged one at ${timeLabel(s.earliest.ts)}`});
  tiles.push({icon:'camera', label:'PROOF PHOTOS', value: `${s.totalPhotos}`, sub:'taken for the archives'});

  return `
    <h2 class="section"><svg class="icon"><use href="#icon-trophy"></use></svg> Hall of Fame</h2>
    <div class="card">
      ${tabs}
      <div class="stat-grid">
        ${tiles.map(t=>`
        <div class="stat-tile">
          <svg class="icon"><use href="#icon-${t.icon}"></use></svg>
          <div class="stat-label">${t.label}</div>
          <div class="stat-value">${t.value}</div>
          <div class="stat-sub">${t.sub}</div>
        </div>`).join("")}
      </div>
      ${tiles.length < 3 ? `<div class="hint" style="margin-top:12px;">More stats unlock once a few players log a couple of rounds each.</div>` : ""}
    </div>`;
}

function render(){
  if (!roomCode) return;
  clearInterval(tick);
  const nights = Object.values(data.nights || {}).sort((a,b)=> new Date(b.date)-new Date(a.date));

  if (view.page === "invite") return renderInvite();

// ---------- morning after: recap & slideshows ----------
function markRecapSeen(id){
  const seen = JSON.parse(localStorage.getItem("beernight-recap-seen") || "[]");
  if (!seen.includes(id)) {
    seen.push(id);
    localStorage.setItem("beernight-recap-seen", JSON.stringify(seen));
  }
}

function recapNight(){
  const seen = JSON.parse(localStorage.getItem("beernight-recap-seen") || "[]");
  const today = new Date(); today.setHours(0,0,0,0);
  const nights = Object.values(data.nights || {})
    .filter(n=>{
      const d = new Date(n.date); d.setHours(0,0,0,0);
      const total = Object.values(n.people || {}).reduce((s,p)=>s+countOf(p),0);
      return d < today && total > 0;
    })
    .sort((a,b)=> new Date(b.date)-new Date(a.date));
  return { latest: nights[0] || null, unseen: nights.find(n=>!seen.includes(n.id)) || null };
}

const posSuffix = (pos) => {
  const v = pos % 100;
  if (v >= 11 && v <= 13) return "th";
  return ["th","st","nd","rd"][pos % 10] || "th";
};

function renderRecap(nid){

    ${people.filter(p=>countOf(p)>0).map(p=>{

        </span>

    }).join("")}
    <p class="hint" style="text-align:center;">Tap a name to watch their photo slideshow — use the buttons under any photo in a gallery to download or share it.</p>`;

async function startSlideshow(nid, pid){
  const n = data.nights[nid]; const p = n?.people?.[pid];
  if (!p) return;
  statusEl.textContent = "loading photos…";
  await loadGalleryPhotos(pid, nid);
  statusEl.textContent = "room " + roomCode;
  const shots = [
    ...drinksOf(p).map(([id,d])=>({ id, ts:d.ts, tag:"" })),
    ...Object.entries(p.checkpoints || {}).map(([id,c])=>({ id, ts:c.ts, tag:` · 🚨 ${c.milestone}-beer checkpoint` })),
  ].sort((a,b)=> a.ts - b.ts).filter(s=>photoCache[s.id]);
  if (!shots.length) { toast("No photos found for " + p.name); return; }
  const standings = Object.values(n.people || {}).sort((a,b)=>countOf(b)-countOf(a));
  const pos = standings.findIndex(x=>x.id===pid) + 1;

  let i = 0;
  const m = document.createElement("div");
  m.className = "modal";
  m.style.flexDirection = "column";
  m.innerHTML = `
    <img id="ssImg" alt="Slideshow photo">
    <div id="ssCap" style="color:var(--foam);margin-top:12px;font-family:'Lilita One',system-ui;font-size:17px;text-align:center;padding:0 16px;"></div>
    <div id="ssSub" style="color:var(--muted);font-size:13px;margin-top:6px;"></div>
    <div style="color:var(--muted);font-size:12px;margin-top:10px;">tap anywhere to close</div>`;
  const img = m.querySelector("#ssImg"), cap = m.querySelector("#ssCap"), sub = m.querySelector("#ssSub");
  const show = ()=>{
    const s = shots[i];
    img.src = photoCache[s.id];
    cap.textContent = `${p.name} — ${pos}${posSuffix(pos)} place · ${countOf(p)} drinks 🍺`;
    sub.textContent = `photo ${i+1} of ${shots.length} · ${timeLabel(s.ts)}${s.tag}`;
  };
  show();
  const t = setInterval(()=>{ i = (i+1) % shots.length; show(); }, 2500);
  m.onclick = ()=>{ clearInterval(t); m.remove(); };
  document.body.appendChild(m);
}

// ----- shared QR drawing engine -----
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
const inFinder = (r,c,N) => (r<7&&c<7) || (r<7&&c>=N-7) || (r>=N-7&&c<7);

function fitFont(ctx, txt, maxWidth, startPx, minPx, family){
  let size = startPx;
  while (size > minPx) {
    ctx.font = `${size}px ${family}`;
    if (ctx.measureText(txt).width <= maxWidth) break;
    size--;
  }
  ctx.font = `${size}px ${family}`;
}
const displayUrl = (text) => text.replace(/^https?:\/\//, "");

function drawFinder(ctx,x,y,cell,dark,light){
  ctx.fillStyle=dark; roundRect(ctx,x,y,7*cell,7*cell,cell*2.2); ctx.fill();
  ctx.fillStyle=light; roundRect(ctx,x+cell,y+cell,5*cell,5*cell,cell*1.5); ctx.fill();
  ctx.fillStyle=dark; roundRect(ctx,x+2*cell,y+2*cell,3*cell,3*cell,cell); ctx.fill();
}

function makeQRData(text){
  const qr = qrcode(0, "H");   // 30% error correction — survives the centre logo
  qr.addData(text); qr.make();
  return qr;
}

function drawModules(ctx,qr,ox,oy,cell,dark,light,shape){
  const N = qr.getModuleCount();
  ctx.fillStyle = dark;
  for (let r=0;r<N;r++) for (let c=0;c<N;c++){
    if (!qr.isDark(r,c) || inFinder(r,c,N)) continue;
    if (shape === "square") {
      roundRect(ctx, ox+c*cell+cell*0.08, oy+r*cell+cell*0.08, cell*0.84, cell*0.84, cell*0.22);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(ox+c*cell+cell/2, oy+r*cell+cell/2, cell*0.43, 0, Math.PI*2);
      ctx.fill();
    }
  }
  drawFinder(ctx, ox, oy, cell, dark, light);
  drawFinder(ctx, ox+(N-7)*cell, oy, cell, dark, light);
  drawFinder(ctx, ox, oy+(N-7)*cell, cell, dark, light);
}

function centerLogo(ctx,qr,ox,oy,cell,plateColor,dark){
  const N=qr.getModuleCount(), qrSize=N*cell, plate=cell*9;
  roundRect(ctx, ox+qrSize/2-plate/2, oy+qrSize/2-plate/2, plate, plate, 16);
  ctx.fillStyle=plateColor; ctx.fill();
  ctx.strokeStyle=dark; ctx.lineWidth=3;
  roundRect(ctx, ox+qrSize/2-plate/2+4, oy+qrSize/2-plate/2+4, plate-8, plate-8, 12);
  ctx.stroke();
  const cx0=ox+qrSize/2, cy0=oy+qrSize/2;
  ctx.fillStyle="#F2A81D"; roundRect(ctx,cx0-16,cy0-12,32,30,6); ctx.fill();
  ctx.fillStyle="#FFFFFF"; roundRect(ctx,cx0-16,cy0-21,32,12,5); ctx.fill();
}

// ----- style 1: foamy mug -----
function drawMugQR(canvas, text){
  const qr=makeQRData(text), N=qr.getModuleCount();
  const cell=10, qrSize=N*cell, quiet=4*cell, wall=22, foamH=74, handle=58;
  const gw=qrSize+quiet*2+wall*2, gh=qrSize+quiet*2+wall*2+14;
  const W=gw+handle+24, Hh=gh+foamH+88;
  canvas.width=W; canvas.height=Hh;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#17100A"; ctx.fillRect(0,0,W,Hh);
  const gx=12, gy=foamH;
  ctx.strokeStyle="#F7EFDD"; ctx.lineWidth=16;
  ctx.beginPath(); ctx.arc(gx+gw, gy+gh*0.46, gh*0.26, -Math.PI/2, Math.PI/2); ctx.stroke();
  roundRect(ctx,gx,gy,gw,gh,26); ctx.fillStyle="#F7EFDD"; ctx.fill();
  roundRect(ctx,gx+10,gy+10,gw-20,gh-20,18); ctx.fillStyle="#FBEED3"; ctx.fill();
  const ox=gx+(gw-qrSize)/2, oy=gy+(gh-qrSize)/2+4;
  drawModules(ctx,qr,ox,oy,cell,"#2A1607","#FBEED3","dot");
  centerLogo(ctx,qr,ox,oy,cell,"#F7EFDD","#2A1607");
  ctx.fillStyle="#FFFFFF";
  const blobs=9;
  for(let i=0;i<=blobs;i++){
    const bx=gx+(gw/blobs)*i, r=20+((i*37)%15);
    ctx.beginPath(); ctx.arc(bx,gy+2,r,0,Math.PI*2); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(gx+gw*0.2, gy+38, 11, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(gx+gw*0.72, gy+30, 8, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle="#F2A81D";
  [[W-26,gy+gh*0.2,5],[W-16,gy+gh*0.32,3],[W-30,gy+gh*0.44,4]].forEach(([bx,by,r])=>{
    ctx.beginPath(); ctx.arc(bx,by,r,0,Math.PI*2); ctx.fill();
  });
  ctx.fillStyle="#F2A81D"; ctx.font="bold 26px 'Lilita One', system-ui"; ctx.textAlign="center";
  ctx.fillText("ROOM "+roomCode+"  \u00B7  BEER NIGHT", gx+gw/2, gy+gh+38);
  ctx.fillStyle="#9C8467";
  fitFont(ctx, displayUrl(text), gw-16, 17, 10, "system-ui");
  ctx.fillText(displayUrl(text), gx+gw/2, gy+gh+66);
}

// ----- style 2: stout pint -----
function drawStoutQR(canvas, text){
  const qr=makeQRData(text), N=qr.getModuleCount();
  const cell=10, qrSize=N*cell, quiet=4*cell;
  const label=qrSize+quiet*2;
  const gw=label+80, gh=label+230;
  const W=gw+80, Hh=gh+184;
  canvas.width=W; canvas.height=Hh;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#F7EFDD"; ctx.fillRect(0,0,W,Hh);
  const gx=(W-gw)/2, gy=90;
  ctx.fillStyle="#21150B";
  ctx.beginPath();
  ctx.moveTo(gx+18,gy);
  ctx.lineTo(gx+gw-18,gy);
  ctx.bezierCurveTo(gx+gw+14,gy+gh*0.35, gx+gw-30,gy+gh*0.6, gx+gw-22,gy+gh-16);
  ctx.arcTo(gx+gw-22,gy+gh,gx+22,gy+gh,18);
  ctx.arcTo(gx+22,gy+gh,gx+22,gy+gh-16,18);
  ctx.bezierCurveTo(gx+30,gy+gh*0.6, gx-14,gy+gh*0.35, gx+18,gy);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle="#FFF7E6";
  roundRect(ctx,gx+10,gy-58,gw-20,74,26); ctx.fill();
  ctx.strokeStyle="#EFE2C8"; ctx.lineWidth=3;
  for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(gx+26,gy-58+i*17);ctx.lineTo(gx+gw-26,gy-58+i*17);ctx.stroke();}
  const lx=(W-label)/2, ly=gy+70;
  roundRect(ctx,lx,ly,label,label,22); ctx.fillStyle="#FBEED3"; ctx.fill();
  ctx.strokeStyle="#F2A81D"; ctx.lineWidth=5;
  roundRect(ctx,lx+8,ly+8,label-16,label-16,16); ctx.stroke();
  drawModules(ctx,qr,lx+quiet,ly+quiet,cell,"#21150B","#FBEED3","square");
  centerLogo(ctx,qr,lx+quiet,ly+quiet,cell,"#FBEED3","#21150B");
  ctx.fillStyle="#F2A81D"; ctx.font="bold 26px 'Lilita One', system-ui"; ctx.textAlign="center";
  ctx.fillText("BEER NIGHT", W/2, ly+label+46);
  ctx.fillStyle="#21150B"; ctx.font="bold 22px 'Lilita One', system-ui";
  ctx.fillText("ROOM "+roomCode, W/2, ly+label+76);
  ctx.fillStyle="#9C8467"; ctx.font="16px system-ui";
  ctx.fillText("scan to join", W/2, gy+gh+40);
  ctx.fillStyle="#C97E12";
  fitFont(ctx, displayUrl(text), gw-24, 17, 10, "system-ui");
  ctx.fillText(displayUrl(text), W/2, gy+gh+68);
}

// ----- style 3: bottle -----
function drawBottleQR(canvas, text){
  const qr=makeQRData(text), N=qr.getModuleCount();
  const cell=9, qrSize=N*cell, quiet=4*cell;
  const label=qrSize+quiet*2;
  const bodyW=label+56, W=bodyW+140, Hh=label+592;
  canvas.width=W; canvas.height=Hh;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#17100A"; ctx.fillRect(0,0,W,Hh);
  const bx=(W-bodyW)/2;
  const neckW=86, nx=(W-neckW)/2;
  const capY=36, neckY=capY+38, shoulderY=neckY+150, bodyY=shoulderY+70, bodyH=label+220;
  ctx.fillStyle="#4A2A12";
  roundRect(ctx,bx,bodyY,bodyW,bodyH,34); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(nx,neckY+40);
  ctx.lineTo(nx,shoulderY-40);
  ctx.bezierCurveTo(nx-10,shoulderY+30, bx,shoulderY+10, bx+4,bodyY+30);
  ctx.lineTo(bx+bodyW-4,bodyY+30);
  ctx.bezierCurveTo(bx+bodyW,shoulderY+10, nx+neckW+10,shoulderY+30, nx+neckW,shoulderY-40);
  ctx.lineTo(nx+neckW,neckY+40);
  ctx.closePath(); ctx.fill();
  roundRect(ctx,nx,neckY,neckW,90,14); ctx.fill();
  ctx.fillStyle="#5E3A1C";
  roundRect(ctx,bx+16,bodyY+26,18,bodyH-60,9); ctx.fill();
  ctx.fillStyle="#F2A81D";
  roundRect(ctx,nx-8,capY,neckW+16,34,10); ctx.fill();
  ctx.fillStyle="#C97E12";
  for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(nx+(neckW/7)*i, capY+34, 6, 0, Math.PI, false);ctx.fill();}
  ctx.fillStyle="#F2A81D";
  roundRect(ctx,nx-14,neckY+52,neckW+28,30,8); ctx.fill();
  ctx.fillStyle="#241300"; ctx.font="bold 16px 'Lilita One', system-ui"; ctx.textAlign="center";
  ctx.fillText("BEER NIGHT", W/2, neckY+73);
  const lx=(W-label)/2, ly=bodyY+62;
  roundRect(ctx,lx,ly,label,label+66,20); ctx.fillStyle="#FBEED3"; ctx.fill();
  ctx.strokeStyle="#C97E12"; ctx.lineWidth=4;
  roundRect(ctx,lx+7,ly+7,label-14,label+66-14,14); ctx.stroke();
  drawModules(ctx,qr,lx+quiet,ly+quiet-6,cell,"#241300","#FBEED3","dot");
  centerLogo(ctx,qr,lx+quiet,ly+quiet-6,cell,"#FBEED3","#241300");
  ctx.fillStyle="#241300"; ctx.font="bold 24px 'Lilita One', system-ui";
  ctx.fillText("ROOM "+roomCode, W/2, ly+label+40);
  ctx.fillStyle="#9C8467"; ctx.font="15px system-ui";
  ctx.fillText("scan to join the leaderboard", W/2, bodyY+bodyH+40);
  ctx.fillStyle="#F2A81D";
  fitFont(ctx, displayUrl(text), W-40, 17, 10, "system-ui");
  ctx.fillText(displayUrl(text), W/2, bodyY+bodyH+68);
}

// ----- style 4: coaster -----
function drawCoasterQR(canvas, text){
  const qr=makeQRData(text), N=qr.getModuleCount();
  const cell=10, qrSize=N*cell, quiet=4*cell;
  const inner=qrSize+quiet*2;
  const R=Math.ceil(Math.sqrt(2)*inner/2)+58;
  const W=R*2+40, Hh=R*2+84;
  canvas.width=W; canvas.height=Hh;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#17100A"; ctx.fillRect(0,0,W,Hh);
  const cx=W/2, cy=R+20;
  ctx.fillStyle="#F7EFDD";
  const scallops=36;
  for(let i=0;i<scallops;i++){
    const a=(i/scallops)*Math.PI*2;
    ctx.beginPath(); ctx.arc(cx+Math.cos(a)*R, cy+Math.sin(a)*R, 16, 0, Math.PI*2); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle="#F2A81D"; ctx.lineWidth=8;
  ctx.beginPath(); ctx.arc(cx,cy,R-24,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle="#C97E12"; ctx.font="bold 24px 'Lilita One', system-ui";
  const arcText=(str,radius,start,dir)=>{
    const step=0.115*dir;
    let a=start;
    for(const ch of str){
      ctx.save(); ctx.translate(cx+Math.cos(a)*radius, cy+Math.sin(a)*radius);
      ctx.rotate(a+(dir>0?Math.PI/2:-Math.PI/2));
      ctx.textAlign="center"; ctx.fillText(ch,0,0); ctx.restore();
      a+=step;
    }
  };
  arcText("BEER NIGHT", R-52, -Math.PI/2-0.52, 1);
  arcText("ROOM "+roomCode, R-52, Math.PI/2+0.58, -1);
  ctx.fillStyle="#F2A81D";
  [[cx-(R-52),cy],[cx+(R-52),cy]].forEach(([px,py])=>{
    ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);ctx.fill();
  });
  const ox=cx-qrSize/2, oy=cy-qrSize/2;
  drawModules(ctx,qr,ox,oy,cell,"#2A1607","#F7EFDD","dot");
  centerLogo(ctx,qr,ox,oy,cell,"#F7EFDD","#2A1607");
  ctx.fillStyle="#F2A81D"; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  fitFont(ctx, displayUrl(text), W-36, 18, 10, "system-ui");
  ctx.fillText(displayUrl(text), cx, R*2+62);
}

const QR_DRAWERS = { mug:drawMugQR, stout:drawStoutQR, bottle:drawBottleQR, coaster:drawCoasterQR };

function renderNight(n){
  // gallery sub-view
  if (view.galleryPid) {
    const p = n.people?.[view.galleryPid];
    if (!p) { view.galleryPid = null; }
    else {
      const shots = [
        ...drinksOf(p).map(([id,d])=>({ id, ts:d.ts, label: timeLabel(d.ts) })),
        ...Object.entries(p.checkpoints || {}).map(([id,c])=>({ id, ts:c.ts, label: `🚨 ${c.milestone} · ${timeLabel(c.ts)}` })),
      ].sort((a,b)=> b.ts - a.ts);
      app.innerHTML = `
        <button class="back" onclick="actions.closeGallery()"><svg class="icon" style="transform:scaleX(-1);"><use href="#icon-chevron"></use></svg> Back to leaderboard</button>
        <div style="margin:6px 4px 4px;">
          <h2 class="logo" style="font-size:24px;margin:0;">${esc(p.name)}'s night 📸</h2>
          <div class="night-meta">${countOf(p)} drinks · ${esc(n.name)}</div>
        </div>
        ${shots.length===0 ? `<div class="card muted-center" style="margin-top:12px;">No drinks logged yet.</div>` : `
        <div class="gallery">
          ${shots.map(s=>`
            <div class="shot" onclick="actions.viewPhoto('${s.id}')">
              ${photoCache[s.id]
                ? `<img src="${photoCache[s.id]}" alt="Photo at ${s.label}">`
                : `<div style="aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;">loading…</div>`}
              <div class="ts">${s.label}</div>
            </div>`).join("")}
        </div>`}`;
      return;
    }
  }

  const people = Object.values(n.people || {}).sort((a,b)=> countOf(b)-countOf(a) || a.name.localeCompare(b.name));
  const max = Math.max(1, ...people.map(countOf));
  ensureAvatars(people);

  app.innerHTML = `
    <button class="back" onclick="actions.goHome()"><svg class="icon" style="transform:scaleX(-1);"><use href="#icon-chevron"></use></svg> All nights</button>
    <div style="margin:6px 4px 14px;">
      <h2 class="logo" role="button" aria-label="Rename this night" style="font-size:26px;margin:0;cursor:pointer;" onclick="actions.renameNight()">${esc(n.name)} <span style="font-size:14px;opacity:.5;">✏️</span></h2>
      <div class="night-meta">${dateLabel(n.date)}${n.ended ? " · finished" : ""} · 📸 photo + 3 min rule in force</div>
    </div>
    ${n.ended ? "" : `
    <div class="card" style="margin-bottom:16px;">
      <div class="row">
        <input id="personName" placeholder="Add a friend…" maxlength="24">
        <button class="btn" onclick="actions.addPerson()">Add</button>
      </div>
      ${(() => {
        const known = Object.values(data.roster || {}).filter(r => !n.people?.[r.id]);
        if (!known.length) return "";
        return `
        <div style="margin-top:12px;">
          <div style="color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.5px;margin-bottom:6px;">KNOWN IN THIS ROOM — TAP TO ADD</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;">
            ${known.map(r => `<button class="room-pill" onclick="actions.addFromRoster('${r.id}')">${esc(r.name)}</button>`).join("")}
          </div>
        </div>`;
      })()}
    </div>`}
    ${people.length===0 ? `<div class="card muted-center">Add your friends above — first sip starts the race.</div>` : ""}
    ${people.map((p,i)=>{
      const c = countOf(p);
      const pct = c===0 ? 0 : Math.max(8,(c/max)*100);
      const crown = i===0 && c>0;
      const left = cooldownLeft(p);
      return `
      <div class="person" style="${p.out ? 'opacity:.55;' : ''}">
        <div class="fill" style="width:${pct}%;${pct===0?'border-right:none;':''}" aria-hidden="true"></div>
        <div class="person-inner" style="flex-direction:column;align-items:stretch;gap:10px;">
          <div style="display:flex;align-items:center;gap:8px;min-width:0;">
            <span class="rank">${crown ? '<span class="crown">👑</span>' : i+1}</span>
            ${avatarHtml(p)}
            <span class="pname" role="button" style="cursor:pointer;"
                  aria-label="Options for ${esc(p.name)}"
                  onclick="actions.playerMenu('${p.id}')">${esc(p.name)}${p.out ? ' 🏳️' : ''}</span>
            <span class="pcount">${c}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px;justify-content:flex-end;">
            <button class="cam" aria-label="View ${esc(p.name)}'s drink photos" onclick="actions.openGallery('${p.id}')"><svg class="icon"><use href="#icon-camera"></use></svg></button>
            ${n.ended ? "" : p.out ? `
            <button class="plus cooling" style="min-width:132px;font-family:'Lilita One',system-ui;font-size:15px;"
                    aria-label="${esc(p.name)} rejoins the night"
                    onclick="actions.toggleOut('${p.id}')">🍺 I'm back</button>` : `
            <button class="cam" style="font-size:15px;" aria-label="${esc(p.name)} taps out for the night"
                    onclick="actions.toggleOut('${p.id}')"><svg class="icon"><use href="#icon-flag"></use></svg></button>
            <button class="plus ${left>0?'cooling':''}" data-cd="${p.id}" ${left>0?'disabled':''}
                    aria-label="Add a drink for ${esc(p.name)} — photo required"
                    onclick="actions.requestDrink('${p.id}')">${left>0 ? fmtLeft(left) : '<svg class="icon"><use href="#icon-camera"></use></svg> +1'}</button>
            <button class="cam" aria-label="Undo ${esc(p.name)}'s last drink" onclick="actions.undoDrink('${p.id}')"><svg class="icon"><use href="#icon-undo"></use></svg></button>`}
          </div>
        </div>
      </div>`;
    }).join("")}
    <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;">
      ${n.ended ? `<button class="ghost" style="border-color:var(--amber);color:var(--amber);" onclick="actions.openRecap('${n.id}')"><svg class="icon"><use href="#icon-sunrise"></use></svg> Recap &amp; slideshows</button>` : ""}
      <button class="ghost" onclick="actions.showInvite()"><svg class="icon filled"><use href="#icon-mug"></use></svg> Invite QR</button>
      <button class="ghost" onclick="actions.toggleEnded()">${n.ended ? "Reopen night" : "End night"}</button>
      <button class="ghost danger" onclick="actions.deleteNight()"><svg class="icon"><use href="#icon-trash"></use></svg> Delete</button>
    </div>
    <p class="hint">Every point needs a photo with your drink — tap +1 and smile. After each drink there's a 3-minute cooldown before the next one counts. Made a mistake? ↺ undoes the last drink. Tap a player's <b>name</b> for more options, including removing them from the night. Heading home early? Tap the flag to bow out with your score locked in — you can tap back in if you rally. Tap the camera icon to browse anyone's proof gallery. Everyone in room ${esc(roomCode)} shares this board. Drink responsibly and look after each other. 🍻</p>`;

  const pi = $("#personName");
  if (pi) pi.onkeydown = (e)=> e.key==="Enter" && actions.addPerson();

  // live countdowns on cooling buttons
  tick = setInterval(()=>{
    let anyCooling = false;
    for (const p of people) {
      const btn = document.querySelector(`[data-cd="${p.id}"]`);
      if (!btn) continue;
      const left = cooldownLeft(p);
      if (left > 0) {
        anyCooling = true;
        btn.textContent = fmtLeft(left);
        btn.disabled = true; btn.classList.add("cooling");
      } else if (btn.disabled) {
        btn.innerHTML = '<svg class="icon"><use href="#icon-camera"></use></svg> +1';
        btn.disabled = false; btn.classList.remove("cooling");
      }
    }
    if (!anyCooling) clearInterval(tick);
  }, 1000);
}
</script>
